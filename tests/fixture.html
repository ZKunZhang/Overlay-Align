<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>叠图功能验证页</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#243047;font:16px/1.7 system-ui,sans-serif}header{background:white;border-bottom:1px solid #dde3ee;padding:24px 40px}main{max-width:960px;margin:48px auto;padding:0 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{padding:24px;background:white;border:1px solid #dde3ee;border-radius:16px}button{background:#5267ed;color:white;padding:12px 20px;border:0;border-radius:8px;cursor:pointer}input{padding:12px;border:1px solid #ccd3e2;border-radius:8px}section{margin:48px 0;padding:40px;background:white;border-radius:16px;min-height:450px}.marker{width:160px;height:160px;background:#5267ed;border:10px solid #1b2b62;color:white;display:grid;place-items:center}footer{padding:50px;text-align:center}
</style></head><body><header>叠图 / UI OVERLAY · 本地功能验证</header><main><h1>让设计与实现重合</h1><p>本页可用于截图后再次叠加，检查对齐与透明度。</p><div class="grid"><div class="card"><h2>01 / 对齐</h2><p>检查卡片边界与间距。</p></div><div class="card"><h2>02 / 点击穿透</h2><button id="counter">点击次数：0</button></div><div class="card"><h2>03 / 输入</h2><input placeholder="锁定后尝试输入" aria-label="测试输入"></div></div><section><h2>滚动标记 A</h2><div class="marker">160 × 160</div><p>开启跟随页面滚动时，设计图应跟随此区域移动。</p></section><section><h2>滚动标记 B</h2><p>切换滚动模式时，设计图在视口中的位置应保持不变。</p></section><section><h2>滚动标记 C</h2><p>隐藏后操作网页，再从扩展弹窗恢复图片。</p></section></main><footer>所有内容均为本地测试数据</footer><script>let count=0;document.getElementById('counter').addEventListener('click',event=>{event.target.textContent=`点击次数：${++count}`})</script></body></html>
