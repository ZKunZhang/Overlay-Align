<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>叠图 · 本地 UI 对比</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-icon" aria-hidden="true">▧</span><div><h1>叠图<span> / UI OVERLAY</span></h1><p>把设计稿放到真实页面上。</p></div></div>
    <span class="local-badge"><i></i> 仅本地</span>
  </header>

  <main>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden>
    <button id="upload" class="upload-zone" type="button">
      <span class="upload-icon" aria-hidden="true">＋</span>
      <strong id="upload-title">选择一张设计图</strong>
      <span id="upload-description">PNG / JPG / WebP / GIF / AVIF / BMP · 最大 20 MB</span>
      <span class="file-tag">点击选择，也可以拖入图片</span>
    </button>
    <div id="image-info" class="image-info" hidden>
      <img id="thumbnail" alt="当前设计图缩略图">
      <div><strong id="image-name"></strong><span id="image-size"></span></div>
      <button id="replace" class="text-button" type="button">更换</button>
    </div>
    <button id="restore" class="restore" type="button" hidden>使用上次保存的图片</button>

    <fieldset id="controls" disabled>
      <div class="section-heading"><h2>叠加设置</h2><label class="switch-label">显示图片<input id="visible" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span></label></div>
      <div class="control-block">
        <div class="label-row"><label for="opacity">不透明度</label><div class="number-box"><input id="opacity-number" type="number" min="0" max="100" value="50" aria-label="不透明度百分比"><span>%</span></div></div>
        <input id="opacity" class="range" type="range" min="0" max="100" value="50">
        <div class="range-labels"><span>看网页</span><span>看设计稿</span></div>
      </div>
      <div class="control-block">
        <div class="label-row"><label for="scale">缩放比例</label><div class="number-box"><input id="scale-number" type="number" min="10" max="300" step="1" value="100" aria-label="缩放比例百分比"><span>%</span></div></div>
        <input id="scale" class="range" type="range" min="10" max="300" value="100">
        <div class="quick-actions"><button id="actual" type="button">原始尺寸</button><button id="fit" type="button">适应窗口</button><button id="center" type="button">居中</button></div>
      </div>
      <div class="control-block position-block"><div class="label-row"><label for="x">图片位置</label><span class="muted">px</span></div><div class="coordinates"><label><span>X</span><input id="x" type="number" step="1" value="0" aria-label="水平坐标"></label><label><span>Y</span><input id="y" type="number" step="1" value="0" aria-label="垂直坐标"></label><button id="origin" title="回到左上角" type="button">归零</button></div></div>
      <div class="options">
        <label class="option"><input id="locked" type="checkbox"><span><strong>锁定位置，穿透点击</strong><small>锁定后可以正常操作下方网页</small></span></label>
        <label class="option"><input id="document-mode" type="checkbox"><span><strong>跟随页面滚动</strong><small>用于整页设计稿与长页面对比</small></span></label>
      </div>
      <p class="hint">直接拖动网页中的图片定位。选中图片后用方向键微调，按住 Shift 每次移动 10 px，Esc 锁定。</p>
      <div class="bottom-actions"><button id="reset" type="button">重置调整</button><button id="remove" class="danger" type="button">移除图片</button></div>
    </fieldset>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>
  <footer><span class="privacy-dot"></span>图片仅保存在此浏览器，不上传、不联网。</footer>
</body>
</html>
